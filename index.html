<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Cricket Score Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent; /* transparent for OBS overlay */
    overflow: hidden;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  iframe {
    border: none;
    width: 480px;
    height: 200px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <!-- CricketData widget: shows live scores automatically -->
  <iframe src="https://widget.cricketdata.org/livescore.html" width="480" height="200"></iframe>
</div>

<!-- Constant background sound -->
<audio id="loopAudio" src="loop.mp3" loop autoplay></audio>

<script>
  // Adjust audio volume
  const audio = document.getElementById('loopAudio');
  audio.volume = 0.3; // 30% volume
</script>
</body>
</html>
